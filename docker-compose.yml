version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: project_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project_network
    restart: unless-stopped

  backend:
    build: .
    container_name: project_backend
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'  
        reservations:
          memory: 4G
          cpus: '2'
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: 0
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mysecretpassword}@postgres:5432/${DB_NAME:-postgres}
      LLM_API_URL: ${LLM_API_URL}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-to-something-very-secure-2026}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-300}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend:/app/Backend
      - ./ProjectsStorage:/app/ProjectsStorage
      - ./Backend/Model:/app/Backend/Model
    networks:
      - project_network
    restart: unless-stopped

  frontend:
    image: python:3.12-slim
    container_name: project_frontend
    working_dir: /app
    command: python -m http.server 3000 --bind 0.0.0.0
    volumes:
      - ./Frontend:/app
    ports:
      - "3000:3000"
    networks:
      - project_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  project_network:
    driver: bridge