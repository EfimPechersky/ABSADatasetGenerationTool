<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #667eea;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #f0f0f0;
            transform: translateX(-3px);
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin: 0;
        }

        .auto-refresh {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .auto-refresh .dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-login {
            color: #666;
            font-weight: 500;
        }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        /* Основной контент */
        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Информация о проекте */
        .project-info {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .project-info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
        }

        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .categories-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .category-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* Операции */
        .operations-section {
            margin-top: 30px;
        }

        .operations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .operations-section h3 {
            color: #333;
            font-size: 20px;
        }

        .refresh-info {
            font-size: 12px;
            color: #888;
        }

        .operations-grid {
            display: grid;
            gap: 15px;
        }

        .operation-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .operation-card:hover {
            transform: translateX(5px);
        }

        .operation-card.disabled {
            opacity: 0.6;
            background: #e9ecef;
        }

        .operation-card.disabled:hover {
            transform: none;
        }

        .operation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .operation-type {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .lock-icon {
            color: #999;
            font-size: 14px;
        }

        .operation-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-not-started {
            background: #e0e0e0;
            color: #666;
        }

        .status-in-progress {
            background: #cce5ff;
            color: #004085;
        }

        .status-done {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .operation-actions {
            margin-top: 15px;
        }

        .run-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .run-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .run-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .details-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .details-btn:hover {
            transform: translateY(-2px);
        }

        /* Загрузчик */
        .loader {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Сообщения */
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .toast-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .header-left {
                flex-direction: column;
                width: 100%;
            }
            .back-btn {
                width: 100%;
                justify-content: center;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .operation-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()">← Назад</button>
                <h1>📊 Проект</h1>
                <div class="auto-refresh" id="autoRefreshIndicator" style="display: none;">
                    <span class="dot"></span>
                    <span>Автообновление активной операции</span>
                </div>
            </div>
            <div class="user-info">
                <span class="user-login" id="userLogin"></span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div id="content">
            <!-- Содержимое будет загружено сюда -->
        </div>
    </div>

    <script src="check-auth.js"></script>
    <script>
        
        // Статусы операций (будут обновляться с сервера)
        let operationsStatus = {
            'Examples generation': { status: 'Not started', progress: 0 },
            'Dataset generation': { status: 'Not started', progress: 0 },
            'Model training': { status: 'Not started', progress: 0 },
            'Review analysis': { status: 'Not started', progress: 0 }
        };
        
        let refreshInterval = null;
        let currentProjectId = null;
        let projectInfo = null;
        
        // Получение ID проекта из URL
        function getProjectId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }
        
        // Проверка авторизации и загрузка страницы
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверяем токен через функцию из check-auth.js
            const token = checkAuth();
            
            if (!token) {
                // checkAuth уже перенаправит на страницу логина
                return;
            }
            
            // Получаем информацию о пользователе
            const userInfo = getCurrentUser();
            if (userInfo && userInfo.login) {
                document.getElementById('userLogin').textContent = `👤 ${userInfo.login}`;
            }
            
            // Сохраняем токен для использования
            window.accessToken = token;
            
            currentProjectId = getProjectId();
            if (!currentProjectId) {
                showError('ID проекта не указан');
                return;
            }
            
            await loadProject(currentProjectId);
        });
        
        // Загрузка информации о проекте
        async function loadProject(projectId, silent = false) {
            const contentDiv = document.getElementById('content');
            
            if (!silent) {
                contentDiv.innerHTML = `
                    <div class="loader">
                        <div class="spinner"></div>
                        <p>Загрузка информации о проекте...</p>
                    </div>
                `;
            }
            
            try {
                // Используем authFetch для автоматической подстановки токена
                const response = await authFetch(`${API_BASE}/project?project_id=${projectId}`, {
                    method: 'GET'
                });
                
                const data = await response.json();
                
                if (data.status === 'Success') {
                    projectInfo = data.info;
                    // Обновляем статусы операций из ответа сервера
                    if (data.operations_info) {
                        for (const op of data.operations_info) {
                            if (operationsStatus[op.type]) {
                                operationsStatus[op.type].status = op.status;
                                operationsStatus[op.type].progress = Math.round(op.progress * 100) || 0;
                            }
                        }
                    }
                    displayProjectInfo();
                } else {
                    showError(data.message || 'Ошибка загрузки проекта');
                }
                
            } catch (error) {
                console.error('Error:', error);
                if (!silent) {
                    showError('Ошибка соединения с сервером. Проверьте, запущен ли backend.');
                }
            }
        }
        
        // Проверка, можно ли выполнить операцию
        function isOperationExecutable(operationName) {
            const order = ['Examples generation', 'Dataset generation', 'Model training', 'Review analysis'];
            const currentIndex = order.indexOf(operationName);
            if (currentIndex === 0) return true;
            
            const prevOperation = order[currentIndex - 1];
            return operationsStatus[prevOperation] && operationsStatus[prevOperation].status === 'Done';
        }
        
        // Отображение информации о проекте
        function displayProjectInfo() {
            const contentDiv = document.getElementById('content');
            
            // Форматируем дату
            const formattedDate = projectInfo.date ? formatDate(projectInfo.date) : 'Дата неизвестна';
            
            // Создаем HTML для категорий
            const categoriesHtml = projectInfo.categories && projectInfo.categories.length > 0
                ? `<div class="categories-list">
                    ${projectInfo.categories.map(cat => `<span class="category-tag">${escapeHtml(cat)}</span>`).join('')}
                   </div>`
                : '<div class="info-value">Категории не указаны</div>';
            
            const lastUpdate = new Date().toLocaleTimeString();
            
            contentDiv.innerHTML = `
                <div class="content-card">
                    <div class="project-info">
                        <h2>📋 Информация о проекте</h2>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Название проекта</div>
                                <div class="info-value">${escapeHtml(projectInfo.name)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Дата создания</div>
                                <div class="info-value">${formattedDate}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Предметная область</div>
                                <div class="info-value">${escapeHtml(projectInfo.domain)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Категории</div>
                                ${categoriesHtml}
                            </div>
                        </div>
                    </div>
                    
                    <div class="operations-section">
                        <div class="operations-header">
                            <h3>⚙️ Операции проекта</h3>
                            <div class="refresh-info">Последнее обновление: ${lastUpdate}</div>
                        </div>
                        <div class="operations-grid">
                            ${generateOperationCard('Examples generation', '📝 Генерация примеров', 'generateExamples', 'examples')}
                            ${generateOperationCard('Dataset generation', '📊 Генерация размеченного набора примеров', 'generateDataset', 'dataset')}
                            ${generateOperationCard('Model training', '🤖 Обучение модели', 'trainModel', 'model')}
                            ${generateOperationCard('Review analysis', '📋 Анализ отзывов', 'analyzeReviews', 'review')}
                        </div>
                    </div>
                </div>
            `;
            
            // Проверяем, есть ли активная операция для автообновления
            checkAndStartAutoRefresh();
        }
        
        // Генерация HTML карточки операции
        function generateOperationCard(opKey, displayName, functionName, idSuffix) {
            const op = operationsStatus[opKey];
            const isExecutable = isOperationExecutable(opKey);
            const isDisabled = op.status === 'In progress' || op.status === 'Done' || (!isExecutable && op.status !== 'In progress');
            
            let actionButtons = '';
            
            if (opKey === 'Model training' && (op.status === 'Done' || op.status === 'In progress')) {
                actionButtons = `
                    <div class="operation-actions" style="display: flex; gap: 10px;">
                        <button class="run-btn" id="btn-${idSuffix}" 
                            onclick="${functionName}()" 
                            ${isDisabled ? 'disabled' : ''}>
                            ${op.status === 'In progress' ? 'Выполняется...' : '▶ Запустить'}
                        </button>
                        <button class="details-btn" onclick="showModelTrainingDetails()">
                            📊 Подробнее
                        </button>
                    </div>
                `;
            } else if (opKey === 'Review analysis' && op.status === 'Done') {
                actionButtons = `
                    <div class="operation-actions" style="display: flex; gap: 10px;">
                        <button class="run-btn" id="btn-${idSuffix}" 
                            onclick="${functionName}()" 
                            ${isDisabled ? 'disabled' : ''}>
                            ${op.status === 'In progress' ? 'Выполняется...' : '▶ Запустить'}
                        </button>
                        <button class="details-btn" onclick="showReviewAnalysisDashboard()">
                            📊 Результаты
                        </button>
                    </div>
                `;
            } else if (opKey === 'Model training' && op.status === 'Queue') {
                actionButtons = `
                    <div class="operation-actions">
                        <button class="run-btn" id="btn-${idSuffix}" 
                            onclick="${functionName}()" 
                            ${isDisabled ? 'disabled' : ''}>
                            В очереди...
                        </button>
                    </div>
                `;
            } else {
                actionButtons = `
                    <div class="operation-actions">
                        <button class="run-btn" id="btn-${idSuffix}" 
                            onclick="${functionName}()" 
                            ${isDisabled ? 'disabled' : ''}>
                            ${op.status === 'In progress' ? 'Выполняется...' : '▶ Запустить'}
                        </button>
                    </div>
                `;
            }
            
            const lockHtml = (op.status === 'Not started' && !isExecutable) ? '<span class="lock-icon"> 🔒</span>' : '';
            
            return `
                <div class="operation-card ${!isExecutable && op.status !== 'In progress' ? 'disabled' : ''}" id="card-${idSuffix}">
                    <div class="operation-header">
                        <div class="operation-type">
                            ${displayName}
                            ${lockHtml}
                        </div>
                    </div>
                    <div class="operation-status ${getStatusClass(op.status)}">${getStatusText(op.status)}</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${op.progress}%"></div>
                    </div>
                    <div class="progress-text">Прогресс: ${op.progress}%</div>
                    ${actionButtons}
                </div>
            `;
        }
        
        // Генерация примеров
        async function generateExamples() {
            const btn = document.getElementById('btn-examples');
            const operationType = 'Examples generation';
            
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Запуск...';
            }
            
            try {
                const response = await authFetch(`${API_BASE}/generate_examples`, {
                    method: 'POST',
                    body: JSON.stringify({ project_id: currentProjectId })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showToast(`Операция "${operationType}" успешно запущена!`);
                    await loadProject(currentProjectId, true);
                } else {
                    showToast(result.message || 'Ошибка при запуске операции', true);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '▶ Запустить';
                    }
                }
                
            } catch (error) {
                console.error('Error:', error);
                showToast(`Ошибка: ${error.message}`, true);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '▶ Запустить';
                }
            }
        }
        
        // Генерация датасета
        async function generateDataset() {
            const btn = document.getElementById('btn-dataset');
            const operationType = 'Dataset generation';
            
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Запуск...';
            }
            
            try {
                const response = await authFetch(`${API_BASE}/get_examples?project_id=${currentProjectId}`, {
                    method: 'GET'
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    const annotationData = {
                        generatedExamples: result.data,
                        domain: result.domain,
                        categories: result.categories,
                        project_id: currentProjectId,
                        code: Date.now()
                    };
                    
                    sessionStorage.setItem('annotationData', JSON.stringify(annotationData));
                    window.location.href = 'annotation.html';
                } else {
                    showToast(result.message || 'Ошибка при получении данных для аннотации', true);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '▶ Запустить';
                    }
                }
                
            } catch (error) {
                console.error('Error:', error);
                showToast(`Ошибка: ${error.message}`, true);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '▶ Запустить';
                }
            }
        }
        
        // Обучение модели
        async function trainModel() {
            const operationType = 'Model training';
            
            const isExecutable = isOperationExecutable(operationType);
            if (!isExecutable) {
                showToast(`Операция "${operationType}" недоступна. Сначала выполните предыдущие операции.`, true);
                return;
            }
            
            openTrainModelModal();
        }
        
        // Открытие модального окна
        function openTrainModelModal() {
            const modalHtml = `
                <div id="trainModelModal" class="modal-overlay">
                    <div class="modal-container">
                        <div class="modal-header">
                            <h2>🤖 Обучение модели</h2>
                            <button class="modal-close" onclick="closeTrainModelModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <p class="modal-subtitle">Введите параметры обучения модели ИИ</p>
                            
                            <div class="form-group-modal">
                                <label>Количество эпох (1-1000)</label>
                                <input type="number" id="modalEpochs" min="1" max="1000" placeholder="Например: 10">
                                <div class="error-text" id="epochsError"></div>
                            </div>
                            
                            <div class="form-group-modal">
                                <label>Размер батча (1-32)</label>
                                <input type="number" id="modalBatchSize" min="1" max="32" placeholder="Например: 8">
                                <div class="error-text" id="batchSizeError"></div>
                            </div>
                            
                            <div class="modal-buttons">
                                <button class="modal-btn-cancel" onclick="closeTrainModelModal()">Отмена</button>
                                <button class="modal-btn-submit" onclick="submitTrainModel()">Начать обучение</button>
                            </div>
                            <div id="modalMessage" class="modal-message"></div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            addModalStyles();
        }
        
        // Закрытие модального окна
        function closeTrainModelModal() {
            const modal = document.getElementById('trainModelModal');
            if (modal) modal.remove();
        }
        
        // Отправка параметров обучения
        async function submitTrainModel() {
            const epochs = document.getElementById('modalEpochs').value;
            const batchSize = document.getElementById('modalBatchSize').value;
            const epochsError = document.getElementById('epochsError');
            const batchSizeError = document.getElementById('batchSizeError');
            const modalMessage = document.getElementById('modalMessage');
            
            epochsError.textContent = '';
            batchSizeError.textContent = '';
            modalMessage.textContent = '';
            
            let isValid = true;
            
            if (!epochs || epochs < 1 || epochs > 1000) {
                epochsError.textContent = 'Введите количество эпох от 1 до 1000';
                isValid = false;
            }
            
            if (!batchSize || batchSize < 1 || batchSize > 32) {
                batchSizeError.textContent = 'Введите размер батча от 1 до 32';
                isValid = false;
            }
            
            if (!isValid) return;
            
            const submitBtn = document.querySelector('.modal-btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Запуск...';
            
            try {
                const response = await authFetch(`${API_BASE}/train_model`, {
                    method: 'POST',
                    body: JSON.stringify({
                        project_id: currentProjectId,
                        epochs: parseInt(epochs),
                        batch_size: parseInt(batchSize)
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    modalMessage.className = 'modal-message success';
                    modalMessage.textContent = 'Обучение модели успешно запущено!';
                    setTimeout(() => {
                        closeTrainModelModal();
                        loadProject(currentProjectId, true);
                    }, 1500);
                } else {
                    modalMessage.className = 'modal-message error';
                    modalMessage.textContent = result.message || 'Ошибка при запуске обучения';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Начать обучение';
                }
                
            } catch (error) {
                console.error('Error:', error);
                modalMessage.className = 'modal-message error';
                modalMessage.textContent = `Ошибка: ${error.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Начать обучение';
            }
        }
        
        // Показать детали обучения модели
        function showModelTrainingDetails() {
            sessionStorage.setItem('modelTrainingDetails', JSON.stringify({
                project_id: currentProjectId,
                access_token: window.accessToken
            }));
            window.location.href = 'model_training_details.html';
        }
        
        // Анализ отзывов
        async function analyzeReviews() {
            const operationType = 'Review analysis';
            
            const isExecutable = isOperationExecutable(operationType);
            if (!isExecutable) {
                showToast(`Операция "${operationType}" недоступна. Сначала выполните обучение модели.`, true);
                return;
            }
            
            if (operationsStatus[operationType].status === 'In progress') {
                showToast(`Операция "${operationType}" уже выполняется.`, true);
                return;
            }
            
            const btn = document.getElementById('btn-review');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Запуск...';
            }
            
            try {
                const response = await authFetch(`${API_BASE}/analyse_reviews`, {
                    method: 'POST',
                    body: JSON.stringify({ project_id: currentProjectId })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showToast(`Операция "${operationType}" успешно запущена!`);
                    await loadProject(currentProjectId, true);
                } else {
                    showToast(result.message || 'Ошибка при запуске операции', true);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '▶ Запустить';
                    }
                }
                
            } catch (error) {
                console.error('Error:', error);
                showToast(`Ошибка: ${error.message}`, true);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '▶ Запустить';
                }
            }
        }
        
        // Показать дашборд с результатами
        function showReviewAnalysisDashboard() {
            sessionStorage.setItem('dashboardData', JSON.stringify({
                project_id: currentProjectId,
                access_token: window.accessToken
            }));
            window.location.href = 'dashboard.html';
        }
        
        // Добавление стилей для модального окна

                    .form-group-modal label {
                        display: block;
                        margin-bottom: 8px;

        // Автообновление
        function checkAndStartAutoRefresh() {
            const hasActiveOperation = Object.values(operationsStatus).some(op => op.status === 'In progress');
            const indicator = document.getElementById('autoRefreshIndicator');
            
            if (hasActiveOperation) {
                if (!refreshInterval) {
                    refreshInterval = setInterval(() => {
                        if (currentProjectId) loadProject(currentProjectId, true);
                    }, 5000);
                    indicator.style.display = 'flex';
                }
            } else {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                    indicator.style.display = 'none';
                }
            }
        }
        
        // Вспомогательные функции
        function getStatusClass(status) {
            switch (status) {
                case 'Not started': return 'status-not-started';
                case 'In progress': return 'status-in-progress';
                case 'Done': return 'status-done';
                case 'Error': return 'status-error';
                default: return 'status-not-started';
            }
        }
        
        function getStatusText(status) {
            switch (status) {
                case 'Not started': return '⏳ Не запущена';
                case 'In progress': return '🔄 Выполняется';
                case 'Done': return '✅ Завершена';
                case 'Error': return '❌ Ошибка';
                default: return status;
            }
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'Дата неизвестна';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString('ru-RU', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return dateString;
            }
        }
        
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function showError(message) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="content-card">
                    <div class="error-message">❌ ${escapeHtml(message)}</div>
                    <button class="back-btn" onclick="goBack()" style="width: 100%; justify-content: center;">← Вернуться к проектам</button>
                </div>
            `;
        }
        
        function goBack() {
            if (refreshInterval) clearInterval(refreshInterval);
            window.location.href = 'Projects.html';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
